plugins {
     id 'com.android.application'
}

android {
    namespace = "org.libsdl.ilm"
    compileSdkVersion 35
    ndkVersion = "28.2.13676358"
    
    defaultConfig {
        applicationId 'org.libsdl.ilm'
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        
        externalNativeBuild {
            cmake {
                //arguments "-DANDROID_PLATFORM=android-21", "-DANDROID_STL=c++_static"
                arguments "-DANDROID_PLATFORM=android-34", "-DANDROID_STL=c++_static"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                abiFilters 'arm64-v8a'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    //applicationVariants.all { variant ->
    //    tasks["merge${variant.name.capitalize()}Assets"]
    //        .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    //}
    //sourceSets.main {
    //    jniLibs.srcDir 'libs'
    //}
    externalNativeBuild {
        cmake {
            path 'src/main/c/CMakeLists.txt'
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        prefab true
    }
}

dependencies {
    //implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation files('libs/SDL3-3.4.16.aar')
}
